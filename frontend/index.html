<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Red5-DHCP · BMS Monitor</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --txt:#e6edf3; --dim:#8b98a5; --accent:#4aa3ff; --ok:#3fb950;
    --off:#6e7681; --warn:#d29922; --alarm:#f85149; --standby:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .drv{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .drv .m{display:flex;flex-direction:column;line-height:1.15}
  .drv .m b{font-size:15px}
  .drv .m span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.ok{background:rgba(63,185,80,.15);color:var(--ok)}
  .pill.off{background:rgba(110,118,129,.18);color:var(--off)}
  .pill.alarm{background:rgba(248,81,73,.16);color:var(--alarm)}
  .pill.standby{background:rgba(163,113,247,.16);color:var(--standby)}
  main{padding:18px 20px;max-width:1500px;margin:0 auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:26px 0 10px;font-weight:600}
  .sysrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .syscard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .syscard .n{font-size:12px;color:var(--dim)}
  .syscard .big{font-size:22px;font-weight:650;margin-top:2px}
  .syscard .sm{font-size:11px;color:var(--dim);margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .dev{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;cursor:pointer;transition:border-color .15s,transform .05s}
  .dev:hover{border-color:var(--accent)}
  .dev:active{transform:scale(.995)}
  .dev.alarm{border-color:var(--alarm)}
  .dev .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dev .id{font-weight:650;font-size:13.5px}
  .dev .ty{color:var(--dim);font-size:11px;margin-top:1px}
  .dev .ar{color:var(--dim);font-size:11px;margin-top:5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .dev .sum{font-size:12.5px;margin-top:7px;color:var(--txt)}
  .led{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .led.ok{background:var(--ok)} .led.off{background:var(--off)}
  .led.alarm{background:var(--alarm)} .led.standby{background:var(--standby)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tab{padding:5px 12px;border:1px solid var(--line);border-radius:999px;
    background:var(--panel);color:var(--dim);cursor:pointer;font-size:12px}
  .tab.active{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .ov.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(920px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal .mh{display:flex;justify-content:space-between;align-items:flex-start;
    padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  .modal .mh h3{margin:0;font-size:16px}
  .modal .mh .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .x{cursor:pointer;color:var(--dim);font-size:22px;line-height:1;border:none;background:none}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    position:sticky;top:57px;background:var(--panel2)}
  tr.alarm td{background:rgba(248,81,73,.08)}
  .io{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--dim)}
  .val{font-weight:650;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .val.on{color:var(--ok)} .val.offv{color:var(--off)} .val.al{color:var(--alarm)}
  .search{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:7px 11px;font-size:13px;min-width:220px}
  .foot{color:var(--dim);font-size:11px;margin-top:30px;text-align:center;padding-bottom:30px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Red5-DHCP <span class="sub">· DHC-connected hotel BMS</span></h1>
    <div class="sub" id="tally">loading model…</div>
  </div>
  <div class="spacer"></div>
  <div class="drv" id="drv"></div>
</header>

<main>
  <h2>Systems</h2>
  <div class="sysrow" id="systems"></div>

  <h2>Equipment</h2>
  <div class="tabs" id="filters"></div>
  <div class="grid" id="devices"></div>

  <div class="foot" id="foot"></div>
</main>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mh">
      <div>
        <h3 id="mTitle"></h3>
        <div class="meta" id="mMeta"></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <input class="search" id="mSearch" placeholder="filter points…" />
        <button class="x" id="mClose">×</button>
      </div>
    </div>
    <div style="max-height:70vh;overflow:auto">
      <table>
        <thead><tr>
          <th>Point</th><th>Description</th><th>I/O</th><th>Value</th>
          <th>SP</th><th>Trend</th><th>Notes</th>
        </tr></thead>
        <tbody id="mBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let SNAP=null, FILTER="ALL", CURRENT=null;

const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function drvHTML(d){
  const season=d.heating_season?'Heating':'Cooling';
  const occ=d.occupied?'Occupied':'Setback';
  const al=SNAP.alarms;
  return `
   <div class="m"><b>${d.load_pct}%</b><span>Bldg load</span></div>
   <div class="m"><b>${d.oat_c}°C</b><span>Outdoor</span></div>
   <div class="m"><b>${d.oa_rh}%</b><span>OA RH</span></div>
   <div class="m"><b>${d.wetbulb_c}°C</b><span>Wet-bulb</span></div>
   <div class="m"><span class="pill ${d.heating_season?'standby':'ok'}">${season}</span><span>Season</span></div>
   <div class="m"><span class="pill ${d.occupied?'ok':'off'}">${occ}</span><span>Mode</span></div>
   <div class="m"><span class="pill ${al?'alarm':'ok'}">${al} alarm${al===1?'':'s'}</span><span>Status</span></div>`;
}

function systemsHTML(sys){
  return sys.map(s=>`
    <div class="syscard">
      <div class="n">${esc(s.name)}</div>
      <div class="big">${s.running}/${s.devices}</div>
      <div class="sm">${s.points} pts${s.alarms?` · <span style="color:var(--alarm)">${s.alarms} alarm</span>`:''}</div>
    </div>`).join("");
}

function filtersHTML(sys){
  const tabs=[["ALL","All"]].concat(sys.map(s=>[s.name,s.name]));
  return tabs.map(([k,l])=>`<div class="tab ${FILTER===k?'active':''}" data-f="${esc(k)}">${esc(l)}</div>`).join("");
}

function devHTML(d){
  const st=d.status;
  return `<div class="dev ${st==='alarm'?'alarm':''}" data-dev="${esc(d.id)}">
     <div class="top">
       <div><span class="led ${st}"></span><span class="id">${esc(d.id)}</span>
         <div class="ty">${esc(d.type)}</div></div>
       <span class="pill ${st}">${st==='ok'?(d.running===false?'off':'on'):st}</span>
     </div>
     <div class="sum">${esc(d.summary)}</div>
     <div class="ar" title="${esc(d.area)}">${esc(d.area)}</div>
   </div>`;
}

function render(){
  if(!SNAP) return;
  $("drv").innerHTML=drvHTML(SNAP.driver);
  $("tally").textContent=`${SNAP.point_count} points · ${SNAP.device_count} devices · ${SNAP.controller_count} controllers · ${SNAP.panel_count} panels`;
  $("systems").innerHTML=systemsHTML(SNAP.systems);
  $("filters").innerHTML=filtersHTML(SNAP.systems);
  const devs=SNAP.devices.filter(d=>FILTER==="ALL"||d.system===FILTER);
  $("devices").innerHTML=devs.map(devHTML).join("");
  $("foot").textContent=`Red5-DHCP BMS · simulated telemetry · updated ${new Date(SNAP.ts).toLocaleTimeString()}`;
  if(CURRENT){ // refresh open modal
    const d=SNAP.devices.find(x=>x.id===CURRENT);
    if(d) fillModal(d);
  }
}

function valCell(p){
  if(p.state!==null){
    const on=p.state, al=p.alarm;
    const cls=al?'al':(on?'on':'offv');
    return `<span class="val ${cls}">${esc(p.display)}</span>`;
  }
  return `<span class="val">${esc(p.display)}</span>`;
}

function fillModal(d){
  $("mTitle").textContent=`${d.id} — ${d.type}`;
  $("mMeta").innerHTML=`${esc(d.area)} · Panel ${esc(d.panel)} · ${esc(d.controller)} · ${d.points.length} points`;
  const q=($("mSearch").value||"").toLowerCase();
  const rows=d.points.filter(p=>!q||p.tag.toLowerCase().includes(q)||(p.description||"").toLowerCase().includes(q));
  $("mBody").innerHTML=rows.map(p=>`
    <tr class="${p.alarm?'alarm':''}">
      <td><code>${esc(p.tag)}</code></td>
      <td>${esc(p.description)}</td>
      <td><span class="io">${esc(p.io_type)}</span></td>
      <td>${valCell(p)}</td>
      <td>${p.sp?'✓':''}</td>
      <td>${p.trend?'✓':''}</td>
      <td style="color:var(--dim)">${esc(p.notes)}</td>
    </tr>`).join("");
}

function openDev(id){
  CURRENT=id;
  const d=SNAP.devices.find(x=>x.id===id);
  if(!d) return;
  $("mSearch").value="";
  fillModal(d);
  $("ov").classList.add("show");
}
function closeModal(){CURRENT=null;$("ov").classList.remove("show");}

document.addEventListener("click",e=>{
  const dev=e.target.closest("[data-dev]");
  if(dev){openDev(dev.getAttribute("data-dev"));return;}
  const tab=e.target.closest("[data-f]");
  if(tab){FILTER=tab.getAttribute("data-f");render();return;}
});
$("mClose").addEventListener("click",closeModal);
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeModal();});
$("mSearch").addEventListener("input",()=>{if(CURRENT){const d=SNAP.devices.find(x=>x.id===CURRENT);if(d)fillModal(d);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

async function tick(){
  try{
    const r=await fetch("/api/snapshot");
    SNAP=await r.json();
    render();
  }catch(err){ $("tally").textContent="connection lost — retrying…"; }
}
tick();
setInterval(tick,4000);
</script>
</body>
</html>
